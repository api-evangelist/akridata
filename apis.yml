aid: akridata
name: Akridata
description: >-
  Akridata builds AI-powered visual data and inspection tooling for data-centric
  AI teams and manufacturers. Its Data Explorer product helps ML engineers visualize
  large image and video datasets, detect and remove outliers, check class balance,
  sample and de-duplicate data, run image-based similarity search, curate and label
  training sets, and analyze model accuracy. Data Explorer ships a first-party Python
  SDK (akride) plus Docker images and an ingest CLI for programmatic access to catalogs,
  explore/analyze jobs, similarity search, labeling, and visualization job metadata
  against the SaaS endpoint at app.akridata.ai. Akridata also offers Vision Assist,
  Vision Command, and Vision Copilot for real-time AI visual inspection and defect
  detection across manufacturing, automotive, medical device, railway, and agriculture.
  The company was acquired by Dimaag-AI and originally surfaced as a portfolio company
  of Accel and Partech.
